<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 800px;
      background-color: #0b1329;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .banner-container {
      width: 1920px;
      height: 800px;
      position: relative;
      background: #0b1329;
    }

    /* Landmark Photo Container on Right Side */
    .landmark-container {
      position: absolute;
      right: 0;
      top: 0;
      width: 1150px;
      height: 800px;
      overflow: hidden;
    }
    .landmark-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: contrast(1.08) brightness(1.02);
    }

    /* Soft Gradient Blend Masking photo smoothly into navy background */
    .photo-blend-mask {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, 
        #0b1329 0%, 
        #0b1329 25%, 
        rgba(11, 19, 41, 0.85) 45%, 
        rgba(11, 19, 41, 0.35) 65%, 
        transparent 85%);
    }

    /* Waving 3D Satin Flag draped naturally in top-right sky area */
    .flag-wave-container {
      position: absolute;
      right: -20px;
      top: -30px;
      width: 950px;
      height: 650px;
      pointer-events: none;
      perspective: 1000px;
    }
    .flag-wave-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform: rotateY(-14deg) rotateX(8deg) rotateZ(-3deg);
      transform-origin: right top;
    }
    .flag-svg-wrapper {
      width: 100%;
      height: 100%;
      opacity: 0.88;
      filter: drop-shadow(-15px 25px 35px rgba(0,0,0,0.7));
    }
    .satin-folds {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(135deg, rgba(255,255,255,0.45) 0%, transparent 35%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85) 100%),
        repeating-linear-gradient(115deg, transparent 0px, transparent 50px, rgba(255,255,255,0.22) 80px, rgba(0,0,0,0.35) 110px, transparent 140px);
      mix-blend-mode: overlay;
    }

    /* Ambient Warm Glow behind landmark & flag */
    .glow-orb {
      position: absolute;
      right: 250px;
      top: 100px;
      width: 750px;
      height: 750px;
      background: radial-gradient(circle, rgba(22, 163, 74, 0.4) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }

    /* Signature Golden Sweeping Arcs & Particle Dust Overlay */
    .golden-arc-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
