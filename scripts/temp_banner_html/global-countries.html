<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 800px;
      background-color: #0b1329;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .banner-container {
      width: 1920px;
      height: 800px;
      position: relative;
      background: #0b1329;
    }

    /* World Landmark Photo Container on Right Side */
    .landmark-container {
      position: absolute;
      right: 0;
      top: 0;
      width: 1250px;
      height: 800px;
      overflow: hidden;
    }
    .landmark-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: contrast(1.1) brightness(0.9);
    }

    /* Soft Gradient Blend Masking photo smoothly into navy background */
    .photo-blend-mask {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, 
        #0b1329 0%, 
        #0b1329 25%, 
        rgba(11, 19, 41, 0.88) 45%, 
        rgba(11, 19, 41, 0.45) 70%, 
        transparent 95%);
    }

    /* Ambient Lighting Glow Orbs */
    .glow-orb-primary {
      position: absolute;
      right: 280px;
      top: 60px;
      width: 750px;
      height: 750px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, rgba(56, 189, 248, 0.2) 50%, transparent 75%);
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
    }

    /* 3D Floating Grid/Sphere Container for ALL 22 Flags */
    .flags-matrix-container {
      position: absolute;
      right: 30px;
      top: 40px;
      width: 1050px;
      height: 720px;
      perspective: 1200px;
      pointer-events: none;
    }

    .flags-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px 14px;
      width: 100%;
      height: 100%;
      padding: 20px;
      transform: rotateY(-14deg) rotateX(7deg) rotateZ(-2deg);
      transform-origin: right center;
    }

    .flag-badge-card {
      position: relative;
      height: 140px;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease;
    }

    .flag-badge-card.featured-india {
      grid-column: span 2;
      grid-row: span 2;
      height: 296px;
      border: 3px solid #fbbf24;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(249, 115, 22, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      z-index: 10;
    }

    .flag-svg-area {
      width: 100%;
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .flag-svg-area svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .satin-shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 45%, rgba(0,0,0,0.55) 100%);
      mix-blend-mode: overlay;
    }

    .flag-label-bar {
      height: 32px;
      background: rgba(11, 19, 41, 0.92);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      items-center;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 8px;
    }
    .flag-label-bar.featured-bar {
      height: 48px;
      background: linear-gradient(90deg, #78350f, #b45309, #78350f);
    }

    .country-code-emoji {
      font-size: 16px;
      line-height: 1;
    }
    .country-title {
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .featured-title {
      font-size: 18px;
      font-weight: 900;
      color: #fef08a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Signature Sweeping Golden Arcs & Floating Light Particles */
    .golden-arc-svg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }
  </style>
</head>
