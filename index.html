    <!--
      ANALYTICS & TAGGING
      Four tools are installed, each doing a different job:

        • Google Tag Manager (GTM-P22J94C4) — the container. Use it to add future
          tags (Google Ads conversions, LinkedIn) WITHOUT editing code.
        • Google Analytics 4 (G-HP7Y4X2MCB) — installed directly below, so traffic
          data is never dependent on the GTM container being configured correctly.
        • Microsoft Clarity (yjkmhz404j) — heatmaps and session recordings.
        • Meta Pixel (1722801308806118) — Facebook/Instagram ad tracking.

      IMPORTANT — READ BEFORE EDITING THE GTM CONTAINER:
      GA4 is hardcoded here. Do NOT also create a GA4 Configuration tag for
      G-HP7Y4X2MCB inside GTM, or every pageview is counted twice and all of your
      traffic and conversion numbers become wrong. Pick one place for GA4; this
      file is that place.

      Meta Pixel is also hardcoded here. Do NOT also add a Meta Pixel tag inside
      GTM for the same pixel ID, or every event fires twice.

      SPA PAGEVIEWS: this is a single-page app, so navigation between routes does
      not reload the page. GA4's Enhanced Measurement setting "Page changes based
      on browser history events" is what records those route changes. Confirm it
      is ON in GA4 → Admin → Data Streams → your stream → Enhanced measurement,
      otherwise only the first page of each visit is recorded. Clarity handles
      SPA route changes on its own.
    -->

    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.clarity.ms" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-P22J94C4');</script>
    <!-- End Google Tag Manager -->

    <!-- Google tag (gtag.js) — GA4 -->
    <script async data-analytics src="https://www.googletagmanager.com/gtag/js?id=G-HP7Y4X2MCB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HP7Y4X2MCB');
    </script>
    <!-- End Google tag -->

    <!-- Microsoft Clarity -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "yjkmhz404j");
    </script>
    <!-- End Microsoft Clarity -->

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1722801308806118');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->

    <!--
      ICONS
      favicon.ico is listed FIRST and deliberately. Browsers request /favicon.ico
      by default for any URL that has no HTML head to read a <link> from —
      /sitemap.xml, /robots.txt, a direct image URL, a plain 404.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
